[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deepdub-qc"
version = "0.1.0"
description = "Deepdub automated media quality-control engine. Deterministic media analysis, rule evaluation, and QC reporting."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Proprietary" }
authors = [{ name = "Deepdub", email = "daniel.cymes@deepdub.ai" }]
dependencies = [
    "pydantic>=2.8",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "weasyprint>=62",
    # Phase 3.5 server (ADR-014)
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    # Webhook delivery (ADR-028): imported by server/routing.py at RUNTIME.
    # Was dev-only (as the test client) until the first --no-dev install on
    # the RDP host crashed serve with ModuleNotFoundError.
    "httpx>=0.27",
]

[project.scripts]
deepdub-qc = "deepdub_qc.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml>=6.0",
]

# Deliberately NOT in `dev`, and therefore not installed by a bare `uv sync` or
# `uv run`. The Windows delivery host builds its environment from this lockfile
# (docs/windows-deployment.md section 7) and may have no PyPI access, so a
# lint-only tool must never sit in the dependency path of `deepdub-qc serve`.
# Used by `make layers` and CI via `--group lint`.
#
# import-linter mechanizes the ARCHITECTURE section 4 layering rules
# (ADR-010, backlog #30); risk R6 predicts boundary erosion under deadline
# pressure, and review alone does not catch a single added import.
lint = [
    "import-linter>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/deepdub_qc"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "PTH", # use pathlib
    "RUF", # ruff-specific
    "N",   # pep8-naming
    "PL",  # pylint subset
]
ignore = [
    "PLR2004", # magic-value comparisons are fine in tests/validators
]

[tool.ruff.lint.isort]
# Explicit so local and CI ruff agree regardless of environment layout.
known-first-party = ["deepdub_qc"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR0913"]
# ID factories intentionally take one argument per identifying content part (ADR-008).
"src/deepdub_qc/utils/ids.py" = ["PLR0913"]
# Measurement factories take one argument per measurement field.
"src/deepdub_qc/detectors/**" = ["PLR0913"]
# Mock fixture factories mirror the full Measurement/Finding field sets.
"src/deepdub_qc/reports/mock_result.py" = ["PLR0913"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
packages = ["deepdub_qc"]
warn_unreachable = true
show_error_codes = true

[[tool.mypy.overrides]]
# WeasyPrint ships no type stubs; its use is confined to pdf_renderer.
module = "weasyprint.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: tests that exercise multiple subsystems together",
    "requires_toolchain: needs every tool in tests/conftest.py REQUIRED_TOOLS; skips locally, aborts collection under DEEPDUB_QC_REQUIRE_TOOLCHAIN=1",
]

[[tool.mypy.overrides]]
module = "playwright.*"
ignore_missing_imports = true

# --- Layering enforcement (ADR-010, backlog #30) -----------------------------
# ARCHITECTURE.md section 4 states the import rules and notes they are
# "enforced by review and, later, import-linter". This is that enforcement.
# Risk R6 predicts these boundaries erode under deadline pressure — the exact
# failure mode that makes Vidchecker-class tools unmaintainable — and a code
# review does not reliably catch a single added import.
#
# Run with `make layers` or `uv run lint-imports`.
[tool.importlinter]
root_package = "deepdub_qc"

[[tool.importlinter.contracts]]
name = "Layered architecture (ARCHITECTURE.md section 4)"
type = "layers"
# Higher layers may import lower ones, never the reverse. Modules separated by
# ':' share a layer and are independent: they may not import each other.
#
# Deviation from the ARCHITECTURE.md diagram, recorded here deliberately:
# cli and server are separate layers rather than peers, because the `serve`
# command legitimately constructs the server app (cli.py:287-294). server sits
# below cli and above orchestration.
layers = [
    "deepdub_qc.cli",
    "deepdub_qc.server",
    "deepdub_qc.orchestration",
    "deepdub_qc.detectors : deepdub_qc.rules : deepdub_qc.reports : deepdub_qc.evidence : deepdub_qc.comparison",
    "deepdub_qc.presets",
    "deepdub_qc.models",
    "deepdub_qc.utils",
]

# The layers contract above already implies the following, but these named
# contracts exist because they are the project's load-bearing invariants and a
# violation should fail with an error that says which rule was broken, not just
# "illegal import".
[[tool.importlinter.contracts]]
name = "Detectors know nothing about thresholds or clients (ADR-001, ADR-003)"
type = "forbidden"
source_modules = ["deepdub_qc.detectors"]
forbidden_modules = ["deepdub_qc.presets", "deepdub_qc.rules"]

[[tool.importlinter.contracts]]
name = "The rule engine knows nothing about how measurements were produced"
type = "forbidden"
source_modules = ["deepdub_qc.rules"]
forbidden_modules = ["deepdub_qc.detectors", "deepdub_qc.evidence"]

[[tool.importlinter.contracts]]
name = "Renderers consume only the canonical result model (ADR-002)"
type = "forbidden"
source_modules = ["deepdub_qc.reports"]
forbidden_modules = [
    "deepdub_qc.detectors",
    "deepdub_qc.rules",
    "deepdub_qc.presets",
    "deepdub_qc.orchestration",
]

[[tool.importlinter.contracts]]
name = "Models are the shared vocabulary and depend on no application code"
type = "forbidden"
source_modules = ["deepdub_qc.models"]
# utils is omitted: the ARCHITECTURE.md graph places models above utils, so
# that import is permitted by design. It is currently unused.
forbidden_modules = [
    "deepdub_qc.cli",
    "deepdub_qc.server",
    "deepdub_qc.orchestration",
    "deepdub_qc.detectors",
    "deepdub_qc.rules",
    "deepdub_qc.reports",
    "deepdub_qc.evidence",
    "deepdub_qc.presets",
    "deepdub_qc.comparison",
]

[[tool.importlinter.contracts]]
name = "The core is importable as a library without CLI or server deps (ADR-010)"
type = "forbidden"
source_modules = [
    "deepdub_qc.orchestration",
    "deepdub_qc.detectors",
    "deepdub_qc.rules",
    "deepdub_qc.presets",
    "deepdub_qc.reports",
    "deepdub_qc.evidence",
    "deepdub_qc.models",
    "deepdub_qc.utils",
]
forbidden_modules = ["deepdub_qc.cli", "deepdub_qc.server"]
