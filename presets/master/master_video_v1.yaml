# Master - Video Delivery - synthesized from 46 corpus presets by
# scripts/build_master_presets.py (docs/master-preset-spec.md section 3).
#
# Each rule carries the most common corpus value; where the corpus
# disagrees, the full distribution is in the comment above the rule.
#
# ALL THRESHOLDS ARE PLACEHOLDERS PENDING HUMAN APPROVAL (handoff section 30).
schema_version: 1.0.0

preset:
  id: master_video
  version: 1.0.0
  client: deepdub
  content_type: av_delivery
  title: "Master - Video Delivery"
  description: "The single editable baseline for av delivery QC. Defaults synthesized from 46 presets (Vidchecker library + client presets); the per-rule comments show the corpus value spread. Draft until the post-production engineer approves the defaults."
  owner: media-operations
  status: draft
  effective_date: 2026-07-28

defaults:
  blocking: true
  severity: error

rules:
  # corpus values: equals "mxf" x31
  #                equals "mov" x13
  - rule_id: container-format
    parameter_id: container.format
    operator: equals
    expected:
      value: "mxf"
    display_name: "Container Format"
    description: "Vidchecker checked for an IMF package; the container probe normalizes IMF track files to mxf. Package-level IMF conformance is not covered."
    severity: warning
    blocking: false

  # corpus values: between 48000000..52000000 bit/s x2
  #                between 14000000..4e+07 bit/s x1
  #                between 195000000..245000000 bit/s x1
  #                between 27000000..53000000 bit/s x1
  #                between 88000000..112000000 bit/s x1
  - rule_id: overall-bitrate
    parameter_id: container.overall_bitrate
    operator: between
    expected:
      min: 48000000.0
      max: 52000000.0
      unit: "bit/s"
    display_name: "Overall Bitrate (48-52 Mbit/s)"
    severity: warning
    blocking: false

  # corpus values: equals "00:59:45:00" x4
  #                equals "00:59:30:00" x1
  - rule_id: start-timecode
    parameter_id: container.timecode_start
    operator: equals
    expected:
      value: "00:59:45:00"
    display_name: "Start Timecode (00:59:45:00)"
    description: "Drop-frame material reports its timecode with a ';' separator; adjust the expected value for drop-frame deliverables."
    severity: warning
    blocking: false

  # corpus values: equals 10 bit x12
  #                equals 8 bit x12
  - rule_id: video-bit-depth
    parameter_id: video.bit_depth
    operator: equals
    expected:
      value: 10
      unit: "bit"
    applies_to:
      stream_type: video
      quantifier: all
    display_name: "Video Bit Depth (10-bit)"
    severity: warning
    blocking: false

  # corpus values: between 49000000..51000000 bit/s x8
  #                between 110000000..115000000 bit/s x4
  #                between 111000000..115000000 bit/s x4
  #                between 45000000..55000000 bit/s x4
  #                between 88000000..220000000 bit/s x4
  #                between 130000000..240000000 bit/s x2
  #                between 1e+08..4e+08 bit/s x2
  #                between 146000000..206000000 bit/s x1
  #                ...and 9 more variants
  - rule_id: video-bitrate
    parameter_id: video.bitrate
    operator: between
    expected:
      min: 49000000.0
      max: 51000000.0
      unit: "bit/s"
    applies_to:
      stream_type: video
      quantifier: all
    display_name: "Video Bitrate (49-51 Mbit/s)"
    description: "Declared stream bitrate; streams without a declared bit rate skip this rule - see the video.bitrate catalogue limitations."
    severity: warning
    blocking: false

  - rule_id: black-frames
    parameter_id: video.black_frame_event
    operator: less_than_or_equal
    expected:
      value: 2
      unit: "s"
    applies_to:
      stream_type: video
      quantifier: all
    display_name: "Black Frame Spans"
    description: "Start/end-range allowances from the Vidchecker template are not replicated; this caps every black span."
    severity: error
    blocking: true

  # corpus values: equals "mpeg2video" x17
  #                equals "prores" x13
  #                equals "h264" x10
  #                equals "jpeg2000" x3
  #                equals "dnxhd" x2
  #                equals "dvvideo" x1
  - rule_id: video-codec
    parameter_id: video.codec
    operator: equals
    expected:
      value: "mpeg2video"
    applies_to:
      stream_type: video
      quantifier: all
    display_name: "Video Codec (Mpeg2)"
    severity: warning
    blocking: false

  # corpus values: equals "16:9" x30
  #                equals "4:3" x1
  - rule_id: display-aspect-ratio
    parameter_id: video.display_aspect_ratio
    operator: equals
    expected:
      value: "16:9"
    applies_to:
      stream_type: video
      quantifier: all
    display_name: "Display Aspect Ratio (16:9)"
    severity: warning
    blocking: false

  # corpus values: equals "tff" x20
  #                equals "progressive" x6
  - rule_id: field-order
    parameter_id: video.field_order
    operator: equals
    expected:
      value: "tff"
    applies_to:
      stream_type: video
      quantifier: all
    display_name: "Field Order (tff)"
    description: "Checks the declared stream flags; baseband field-dominance analysis is not implemented."
    severity: warning
    blocking: false

  # corpus values: approximately_equals 25 fps x18
  #                approximately_equals 29.97 fps x7
  #                approximately_equals 23.976 fps x2
  #                approximately_equals 50 fps x2
  - rule_id: frame-rate
    parameter_id: video.frame_rate
    operator: approximately_equals
    expected:
      value: 25
      tolerance: 0.01
      unit: "fps"
    applies_to:
      stream_type: video
      quantifier: all
    display_name: "Frame Rate (25 fps)"
    severity: warning
    blocking: false

  # corpus values: less_than_or_equal 10 s x7
  #                less_than_or_equal 5 s x6
  #                less_than_or_equal 30 s x2
  - rule_id: freeze-frames
    parameter_id: video.freeze_frame_event
    operator: less_than_or_equal
    expected:
      value: 10
      unit: "s"
    applies_to:
      stream_type: video
      quantifier: all
    display_name: "Freeze Frame Spans"
    description: "Legitimate static content (title cards, slates) registers as frozen - see the parameter caveat."
    severity: warning
    blocking: false

  # corpus values: equals 1080 px x26
  #                equals 2160 px x2
  #                equals 480 px x2
  #                equals 576 px x2
  #                equals 608 px x1
  - rule_id: video-height
    parameter_id: video.height
    operator: equals
    expected:
      value: 1080
      unit: "px"
    applies_to:
      stream_type: video
      quantifier: all
    display_name: "Frame Height"
    severity: warning
    blocking: false

  # corpus values: equals "41" x8
  #                equals "4" x6
  #                equals "8" x4
  - rule_id: video-level
    parameter_id: video.level
    operator: equals
    expected:
      value: "41"
    applies_to:
      stream_type: video
      quantifier: all
    display_name: "Video Level (H264Level41)"
    description: "ffprobe reports numeric level codes - see the video.level catalogue limitations."
    severity: warning
    blocking: false

  # corpus values: contains "422" x31
  #                contains "444" x3
  #                contains "420" x1
  - rule_id: chroma-subsampling
    parameter_id: video.pixel_format
    operator: contains
    expected:
      value: "422"
    applies_to:
      stream_type: video
      quantifier: all
    display_name: "Chroma Subsampling (422)"
    description: "Checked via the pixel-format token (e.g. yuv422p10le)."
    severity: warning
    blocking: false

  # corpus values: equals "4:2:2" x12
  #                equals "High 4:2:2 Intra" x8
  #                equals "HQ" x6
  #                equals "Main" x1
  - rule_id: video-profile
    parameter_id: video.profile
    operator: equals
    expected:
      value: "4:2:2"
    applies_to:
      stream_type: video
      quantifier: all
    display_name: "Video Profile (Mpeg2422)"
    description: "Compared against ffprobe's profile string - see the video.profile catalogue limitations."
    severity: warning
    blocking: false

  # corpus values: equals "1:1" x24
  #                equals "8:9" x1
  - rule_id: sample-aspect-ratio
    parameter_id: video.sample_aspect_ratio
    operator: equals
    expected:
      value: "1:1"
    applies_to:
      stream_type: video
      quantifier: all
    display_name: "Pixel Aspect Ratio (1:1)"
    severity: warning
    blocking: false

  # corpus values: equals 1920 px x24
  #                equals 720 px x5
  #                equals 2048 px x2
  #                equals 3840 px x2
  - rule_id: video-width
    parameter_id: video.width
    operator: equals
    expected:
      value: 1920
      unit: "px"
    applies_to:
      stream_type: video
      quantifier: all
    display_name: "Frame Width"
    severity: warning
    blocking: false

  # corpus values: equals 1 x9
  #                equals 4 x2
  #                equals 2 x1
  #                equals 8 x1
  - rule_id: audio-channel-count-t1
    parameter_id: audio.channel_count
    operator: equals
    expected:
      value: 4
    applies_to:
      stream_type: audio
    display_name: "Channel Count"
    severity: warning
    blocking: false

  - rule_id: audio-channel-layout
    parameter_id: audio.channel_layout
    operator: in
    expected:
      values: ["stereo"]
    applies_to:
      stream_type: audio
      quantifier: all
    display_name: "Channel Layout (stereo)"
    severity: warning
    blocking: false

  # corpus values: in x52
  #                equals "pcm_s24le" x2
  #                regex x2
  - rule_id: audio-codec-t1
    parameter_id: audio.codec
    operator: in
    expected:
      values: ["pcm_s24le", "pcm_s24be"]
    applies_to:
      stream_type: audio
    display_name: "Audio Codec (PCM 24-bit)"
    severity: warning
    blocking: false

  - rule_id: dual-mono
    parameter_id: audio.duplicate_channel_risk
    operator: equals
    expected:
      value: false
    applies_to:
      stream_type: audio
      quantifier: all
    display_name: "Dual Mono"
    description: "Vidchecker's windowed variant (10 s window) is approximated by a whole-stream measure - see the parameter limitations."
    severity: warning
    blocking: false

  - rule_id: clipping-flat-factor-t1
    parameter_id: audio.flat_factor
    operator: less_than_or_equal
    expected:
      value: 0.01
    applies_to:
      stream_type: audio
    display_name: "Clipping (Flat Factor)"
    description: "Vidchecker clipping sensitivity: Low. Whole-stream indicator, not per-event (audio.clipping_event is planned)."
    severity: warning
    blocking: false

  - rule_id: head-silence
    parameter_id: audio.head_silence_duration
    operator: less_than_or_equal
    expected:
      value: 30.0
      unit: "s"
    display_name: "Head Silence"
    severity: warning
    blocking: false

  # corpus values: between -24..-22 LUFS x26
  #                between -26..-22 LUFS x19
  #                between -23.5..-22.5 LUFS x4
  #                between -45..-15 LUFS x1
  - rule_id: integrated-loudness-t1
    parameter_id: audio.integrated_loudness
    operator: between
    expected:
      min: -24
      max: -22
      unit: "LUFS"
    applies_to:
      stream_type: audio
    display_name: "Integrated Loudness (-23 ±1 LUFS)"
    description: "Vidchecker mode: EBU R128. Measured per stream; multi-mono channel groups need audio.group_integrated_loudness (planned, backlog #35)."
    severity: warning
    blocking: false

  - rule_id: internal-silence
    parameter_id: audio.internal_silence_event
    operator: not_exists
    display_name: "Internal Silence"
    severity: warning
    blocking: false

  - rule_id: loudness-range-max-t1
    parameter_id: audio.loudness_range
    operator: less_than_or_equal
    expected:
      value: 15
      unit: "LU"
    applies_to:
      stream_type: audio
    display_name: "Loudness Range (max)"
    severity: warning
    blocking: false

  # corpus values: less_than_or_equal 1.5 s x6
  #                less_than_or_equal 10 s x2
  - rule_id: min-level-t1
    parameter_id: audio.low_rms_event
    operator: less_than_or_equal
    expected:
      value: 1.5
      unit: "s"
    applies_to:
      stream_type: audio
    display_name: "Min Level (Windowed RMS)"
    description: "Vidchecker level was -56 dBFS; the windowed-RMS detector threshold is fixed at -90 dB (parameter caveat), so this rule approximates the original check."
    severity: warning
    blocking: false

  - rule_id: max-momentary-loudness-t1
    parameter_id: audio.max_momentary_loudness
    operator: less_than_or_equal
    expected:
      value: -15
      unit: "LUFS"
    applies_to:
      stream_type: audio
    display_name: "Max Momentary Loudness"
    severity: warning
    blocking: false

  - rule_id: max-short-term-loudness-t1
    parameter_id: audio.max_short_term_loudness
    operator: less_than_or_equal
    expected:
      value: -20
      unit: "LUFS"
    applies_to:
      stream_type: audio
    display_name: "Max Short-Term Loudness"
    severity: warning
    blocking: false

  # corpus values: less_than_or_equal -0.1 dBFS x33
  #                less_than_or_equal -70 dBFS x2
  - rule_id: clipping-peak-level-t1
    parameter_id: audio.peak_level
    operator: less_than_or_equal
    expected:
      value: -0.1
      unit: "dBFS"
    applies_to:
      stream_type: audio
    display_name: "Clipping (Sample Peak)"
    severity: warning
    blocking: false

  - rule_id: audio-sample-rate-t1
    parameter_id: audio.sample_rate
    operator: equals
    expected:
      value: 48000
      unit: "Hz"
    applies_to:
      stream_type: audio
    display_name: "Sample Rate"
    severity: warning
    blocking: false

  # corpus values: equals 8 x10
  #                equals 16 x5
  #                equals 1 x4
  #                equals 4 x3
  - rule_id: audio-track-count
    parameter_id: audio.stream_count
    operator: equals
    expected:
      value: 8
    display_name: "Audio Track Count"
    severity: warning
    blocking: false

  - rule_id: tail-silence
    parameter_id: audio.tail_silence_duration
    operator: less_than_or_equal
    expected:
      value: 30.0
      unit: "s"
    display_name: "Tail Silence"
    severity: warning
    blocking: false

  # corpus values: less_than_or_equal -1 dBTP x42
  #                less_than_or_equal -2 dBTP x17
  #                less_than_or_equal -3 dBTP x4
  - rule_id: max-peak-level-t1
    parameter_id: audio.true_peak
    operator: less_than_or_equal
    expected:
      value: -1
      unit: "dBTP"
    applies_to:
      stream_type: audio
    display_name: "Peak Level (True Peak)"
    severity: warning
    blocking: false

  # corpus values: approximately_equals 0 s x10
  #                between -0.5..0.5 s x1
  - rule_id: audio-video-length-t1
    parameter_id: audio.video_duration_delta
    operator: approximately_equals
    expected:
      value: 0
      tolerance: 0.5
      unit: "s"
    applies_to:
      stream_type: audio
    display_name: "Audio/Video Duration Match"
    description: "Tolerance 0.5 s is a placeholder; Vidchecker's template carries no explicit tolerance."
    severity: warning
    blocking: false
