# Master - Audio Delivery - synthesized from 11 corpus presets by
# scripts/build_master_presets.py (docs/master-preset-spec.md section 3).
#
# Each rule carries the most common corpus value; where the corpus
# disagrees, the full distribution is in the comment above the rule.
#
# ALL THRESHOLDS ARE PLACEHOLDERS PENDING HUMAN APPROVAL (handoff section 30).
schema_version: 1.0.0

preset:
  id: master_audio
  version: 1.0.0
  client: deepdub
  content_type: dubbed_audio_delivery
  title: "Master - Audio Delivery"
  description: "The single editable baseline for dubbed audio delivery QC. Defaults synthesized from 11 presets (Vidchecker library + client presets); the per-rule comments show the corpus value spread. Draft until the post-production engineer approves the defaults."
  owner: media-operations
  status: draft
  effective_date: 2026-07-28

defaults:
  blocking: true
  severity: error

rules:
  # corpus values: equals "mov" x1
  #                equals "mxf" x1
  - rule_id: container-format
    parameter_id: container.format
    operator: equals
    expected:
      value: "mov"
    display_name: "Container Format"
    severity: error
    blocking: true

  # corpus values: equals 6 x2
  #                equals 1 x1
  #                equals 2 x1
  - rule_id: audio-channel-count
    parameter_id: audio.channel_count
    operator: equals
    expected:
      value: 6
    applies_to:
      stream_type: audio
      quantifier: all
    display_name: "Channel Count"
    severity: error
    blocking: true

  - rule_id: audio-channel-layout
    parameter_id: audio.channel_layout
    operator: in
    expected:
      values: ["5.1", "5.1(side)"]
    applies_to:
      stream_type: audio
      quantifier: all
    display_name: "Channel Layout (5.1)"
    severity: warning
    blocking: false

  # corpus values: in x4
  #                equals "pcm_s24le" x2
  - rule_id: audio-codec
    parameter_id: audio.codec
    operator: in
    expected:
      values: ["pcm_s24le", "pcm_s24be"]
    applies_to:
      stream_type: audio
      quantifier: all
    display_name: "Audio Codec (PCM 24-bit)"
    severity: warning
    blocking: false

  - rule_id: dual-mono
    parameter_id: audio.duplicate_channel_risk
    operator: equals
    expected:
      value: false
    applies_to:
      stream_type: audio
      quantifier: all
    display_name: "Dual Mono"
    description: "Vidchecker's windowed variant (5 s window) is approximated by a whole-stream measure - see the parameter limitations."
    severity: warning
    blocking: false

  - rule_id: clipping-flat-factor
    parameter_id: audio.flat_factor
    operator: less_than_or_equal
    expected:
      value: 0.01
    applies_to:
      stream_type: audio
      quantifier: all
    display_name: "Clipping (Flat Factor)"
    description: "Vidchecker clipping sensitivity: Low. Whole-stream indicator, not per-event (audio.clipping_event is planned)."
    severity: warning
    blocking: false

  - rule_id: head-silence
    parameter_id: audio.head_silence_duration
    operator: less_than_or_equal
    expected:
      value: 30.0
      unit: "s"
    display_name: "Head Silence"
    severity: warning
    blocking: false

  # corpus values: between -24..-22 LUFS x3
  #                between -26..-22 LUFS x3
  #                between -23.5..-22.5 LUFS x2
  #                between -29..-25 LUFS x1
  #                between -40..-15 LUFS x1
  - rule_id: integrated-loudness
    parameter_id: audio.integrated_loudness
    operator: between
    expected:
      min: -24
      max: -22
      unit: "LUFS"
    applies_to:
      stream_type: audio
      quantifier: all
    display_name: "Integrated Loudness (-23 ±1 LUFS)"
    description: "Vidchecker mode: EBU R128. Measured per stream; multi-mono channel groups need audio.group_integrated_loudness (planned, backlog #35)."
    severity: warning
    blocking: false

  - rule_id: internal-silence
    parameter_id: audio.internal_silence_event
    operator: not_exists
    display_name: "Internal Silence"
    severity: warning
    blocking: false

  # corpus values: less_than_or_equal 25 s x2
  #                not_exists x1
  - rule_id: min-level
    parameter_id: audio.low_rms_event
    operator: less_than_or_equal
    expected:
      value: 25
      unit: "s"
    applies_to:
      stream_type: audio
      quantifier: all
    display_name: "Min Level (Windowed RMS)"
    description: "Vidchecker level was -95 dBFS; the windowed-RMS detector threshold is fixed at -90 dB (parameter caveat), so this rule approximates the original check."
    severity: warning
    blocking: false

  - rule_id: max-momentary-loudness
    parameter_id: audio.max_momentary_loudness
    operator: less_than_or_equal
    expected:
      value: -15
      unit: "LUFS"
    applies_to:
      stream_type: audio
      quantifier: all
    display_name: "Max Momentary Loudness"
    severity: error
    blocking: true

  - rule_id: max-short-term-loudness
    parameter_id: audio.max_short_term_loudness
    operator: less_than_or_equal
    expected:
      value: -18
      unit: "LUFS"
    applies_to:
      stream_type: audio
      quantifier: all
    display_name: "Max Short-Term Loudness"
    severity: error
    blocking: true

  - rule_id: clipping-peak-level
    parameter_id: audio.peak_level
    operator: less_than_or_equal
    expected:
      value: -0.1
      unit: "dBFS"
    applies_to:
      stream_type: audio
      quantifier: all
    display_name: "Clipping (Sample Peak)"
    severity: warning
    blocking: false

  - rule_id: audio-sample-rate
    parameter_id: audio.sample_rate
    operator: equals
    expected:
      value: 48000
      unit: "Hz"
    applies_to:
      stream_type: audio
      quantifier: all
    display_name: "Sample Rate"
    severity: warning
    blocking: false

  - rule_id: audio-stream-count
    parameter_id: audio.stream_count
    operator: equals
    expected:
      value: 8
    display_name: "Audio Track Count"
    severity: critical
    blocking: true

  - rule_id: tail-silence
    parameter_id: audio.tail_silence_duration
    operator: less_than_or_equal
    expected:
      value: 30.0
      unit: "s"
    display_name: "Tail Silence"
    severity: warning
    blocking: false

  # corpus values: less_than_or_equal -1 dBTP x4
  #                less_than_or_equal -2 dBTP x1
  - rule_id: max-peak-level
    parameter_id: audio.true_peak
    operator: less_than_or_equal
    expected:
      value: -1
      unit: "dBTP"
    applies_to:
      stream_type: audio
      quantifier: all
    display_name: "Peak Level (True Peak)"
    severity: warning
    blocking: false
