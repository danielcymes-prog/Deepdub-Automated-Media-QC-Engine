#   - GopLength: GOP length is not inspected (no bitstream detector)
#   - Letterboxing: video.letterbox_detected is planned, no detector yet
#   - ColourBars: colour-bars detection is not implemented
#   - FieldOrder: video.field_order is planned, no detector yet
#   - CorruptFrame: video.corrupt_frame_event is planned, no detector yet (backlog #36)
#   - MediaOffline: media-offline slate detection is not implemented
#   - AudioTransient: clicks-and-pops detection is not implemented
schema_version: 1.0.0

preset:
  id: vc109_netflix_licensed_content_v9_0_2k_proreshq_2ch_audio
  version: 1.0.0
  client: vidchecker-library
  content_type: av_delivery
  title: "Netflix - Licensed Content v9.0 - 2K ProResHQ - 2Ch Audio"
  description: "Imported from the Vidchecker template ' - Netflix - Licensed Content v9.0 - 2K ProResHQ - 2Ch Audio'. 16 Vidchecker check(s) are not yet covered; see the preset file header."
  owner: media-operations
  status: draft
  effective_date: 2026-07-27

defaults:
  blocking: true
  severity: error

rules:
  - rule_id: container-format
    parameter_id: container.format
    operator: equals
    expected:
      value: mov
    display_name: "Container Format"

  - rule_id: video-codec
    parameter_id: video.codec
    operator: equals
    expected:
      value: prores
    applies_to:
      stream_type: video
      quantifier: all
    display_name: "Video Codec (ProRes)"

  - rule_id: video-width
    parameter_id: video.width
    operator: equals
    expected:
      value: 2048
      unit: px
    applies_to:
      stream_type: video
      quantifier: all
    display_name: "Frame Width"

  - rule_id: video-height
    parameter_id: video.height
    operator: equals
    expected:
      value: 1080
      unit: px
    applies_to:
      stream_type: video
      quantifier: all
    display_name: "Frame Height"

  - rule_id: chroma-subsampling
    parameter_id: video.pixel_format
    operator: contains
    expected:
      value: "422"
    applies_to:
      stream_type: video
      quantifier: all
    display_name: "Chroma Subsampling (422)"
    description: "Checked via the pixel-format token (e.g. yuv422p10le)."

  - rule_id: black-frames
    parameter_id: video.black_frame_event
    operator: less_than_or_equal
    expected:
      value: 2
      unit: s
    applies_to:
      stream_type: video
      quantifier: all
    display_name: "Black Frame Spans"
    description: "Start/end-range allowances from the Vidchecker template are not replicated; this caps every black span."

  - rule_id: freeze-frames
    parameter_id: video.freeze_frame_event
    operator: less_than_or_equal
    expected:
      value: 10
      unit: s
    applies_to:
      stream_type: video
      quantifier: all
    display_name: "Freeze Frame Spans"
    description: "Legitimate static content (title cards, slates) registers as frozen - see the parameter caveat."

  - rule_id: audio-codec
    parameter_id: audio.codec
    operator: in
    expected:
      values: [pcm_s24le, pcm_s24be]
    applies_to:
      stream_type: audio
      quantifier: all
    display_name: "Audio Codec (PCM 24-bit)"
    severity: warning
    blocking: false

  - rule_id: audio-sample-rate
    parameter_id: audio.sample_rate
    operator: equals
    expected:
      value: 48000
      unit: Hz
    applies_to:
      stream_type: audio
      quantifier: all
    display_name: "Sample Rate"
    severity: warning
    blocking: false

  - rule_id: audio-channel-layout
    parameter_id: audio.channel_layout
    operator: in
    expected:
      values: [stereo]
    applies_to:
      stream_type: audio
      quantifier: all
    display_name: "Channel Layout (stereo)"
    severity: warning
    blocking: false

  - rule_id: max-peak-level
    parameter_id: audio.true_peak
    operator: less_than_or_equal
    expected:
      value: -1
      unit: dBTP
    applies_to:
      stream_type: audio
      quantifier: all
    display_name: "Peak Level (True Peak)"
    severity: warning
    blocking: false

  - rule_id: clipping-flat-factor
    parameter_id: audio.flat_factor
    operator: less_than_or_equal
    expected:
      value: 0.01
    applies_to:
      stream_type: audio
      quantifier: all
    display_name: "Clipping (Flat Factor)"
    description: "Vidchecker clipping sensitivity: Low. Whole-stream indicator, not per-event (audio.clipping_event is planned)."
    severity: warning
    blocking: false

  - rule_id: clipping-peak-level
    parameter_id: audio.peak_level
    operator: less_than_or_equal
    expected:
      value: -0.1
      unit: dBFS
    applies_to:
      stream_type: audio
      quantifier: all
    display_name: "Clipping (Sample Peak)"
    severity: warning
    blocking: false
