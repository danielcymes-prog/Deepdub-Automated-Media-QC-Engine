#
# ALL THRESHOLDS ARE PLACEHOLDERS PENDING HUMAN APPROVAL (handoff section 30).
#
# Vidchecker checks NOT covered by this preset (no implemented
# parameter yet - see docs/vidchecker-import.md):
#   - Video Profile/Level ProResHq/VideoLevelNone: video.profile and video.level are planned, no
#   - detector yet
#   - EnhancedSyntax: codec bitstream syntax is not inspected
#   - PixelAspectRatio: video.sample_aspect_ratio is planned, no detector yet
#   - StartTimecode: container.timecode_start is planned, no detector yet
#   - Black Frame (required black segments): positional requirements are not expressible; only
#   - maximum-duration caps are
#   - ColourBars: colour-bars detection is not implemented
#   - Flash: PSE/flashing analysis is not implemented
schema_version: 1.0.0

preset:
  id: vc046_amazon_v5_0_prores422hq_mov_8ch
  version: 1.0.0
  client: vidchecker-library
  content_type: av_delivery
  title: "Amazon v5.0 - ProRes422HQ MOV - 8Ch"
  description: "Imported from the Vidchecker template '- Amazon v5.0 - ProRes422HQ MOV - 8Ch'. Vidchecker note: This template provides a basis for testing to the Amazon Studios specification, dated 16/03/2015. 7 Vidchecker check(s) are not yet covered; see the preset file header."
  owner: media-operations
  status: draft
  effective_date: 2026-07-27

defaults:
  blocking: true
  severity: error

rules:
  - rule_id: container-format
    parameter_id: container.format
    operator: equals
    expected:
      value: mov
    display_name: "Container Format"

  - rule_id: video-codec
    parameter_id: video.codec
    operator: equals
    expected:
      value: prores
    applies_to:
      stream_type: video
      quantifier: all
    display_name: "Video Codec (ProRes)"

  - rule_id: video-width
    parameter_id: video.width
    operator: equals
    expected:
      value: 1920
      unit: px
    applies_to:
      stream_type: video
      quantifier: all
    display_name: "Frame Width"

  - rule_id: video-height
    parameter_id: video.height
    operator: equals
    expected:
      value: 1080
      unit: px
    applies_to:
      stream_type: video
      quantifier: all
    display_name: "Frame Height"

  - rule_id: chroma-subsampling
    parameter_id: video.pixel_format
    operator: contains
    expected:
      value: "422"
    applies_to:
      stream_type: video
      quantifier: all
    display_name: "Chroma Subsampling (422)"
    description: "Checked via the pixel-format token (e.g. yuv422p10le)."
    severity: warning
    blocking: false

  - rule_id: frame-rate
    parameter_id: video.frame_rate
    operator: approximately_equals
    expected:
      value: 23.976
      tolerance: 0.01
      unit: fps
    applies_to:
      stream_type: video
      quantifier: all
    display_name: "Frame Rate (23.976 fps)"
    severity: warning
    blocking: false

  - rule_id: video-bit-depth
    parameter_id: video.pixel_format
    operator: regex
    expected:
      pattern: "p10(le|be)$"
    applies_to:
      stream_type: video
      quantifier: all
    display_name: "Video Bit Depth (10-bit, via pixel format)"
    description: "video.bit_depth is planned; the pixel-format token encodes component depth in the meantime."
    severity: warning
    blocking: false

  - rule_id: audio-track-count
    parameter_id: audio.stream_count
    operator: equals
    expected:
      value: 8
    display_name: "Audio Track Count"

  - rule_id: audio-codec-t1
    parameter_id: audio.codec
    operator: in
    expected:
      values: [pcm_s24le, pcm_s24be]
    applies_to:
      stream_type: audio
      selector:
        index: 0
    display_name: "Audio Codec (PCM 24-bit)"

  - rule_id: audio-sample-rate-t1
    parameter_id: audio.sample_rate
    operator: equals
    expected:
      value: 48000
      unit: Hz
    applies_to:
      stream_type: audio
      selector:
        index: 0
    display_name: "Sample Rate"

  - rule_id: audio-channel-count-t1
    parameter_id: audio.channel_count
    operator: equals
    expected:
      value: 1
    applies_to:
      stream_type: audio
      selector:
        index: 0
    display_name: "Channel Count"
    severity: warning
    blocking: false

  - rule_id: integrated-loudness-t1
    parameter_id: audio.integrated_loudness
    operator: between
    expected:
      min: -26
      max: -22
      unit: LUFS
    applies_to:
      stream_type: audio
      selector:
        index: 0
    display_name: "Integrated Loudness (-24 \u00b12 LUFS)"
    description: "Vidchecker mode: ITU-R BS.1770. Measured per stream; multi-mono channel groups need audio.group_integrated_loudness (planned, backlog #35)."
    severity: warning
