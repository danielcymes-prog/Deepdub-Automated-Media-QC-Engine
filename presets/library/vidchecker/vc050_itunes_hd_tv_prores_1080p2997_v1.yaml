# parameter yet - see docs/vidchecker-import.md):
#   - ContainerEssenceConsistency: container/essence consistency is not inspected
#   - EnhancedSyntax: codec bitstream syntax is not inspected
#   - ITunesCompatibility: iTunes package conformance is not implemented
