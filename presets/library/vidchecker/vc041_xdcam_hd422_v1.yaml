    blocking: false

  - rule_id: video-profile
    parameter_id: video.profile
    operator: equals
    expected:
      value: "4:2:2"
    applies_to:
      stream_type: video
      quantifier: all
    display_name: "Video Profile (Mpeg2422)"
    description: "Compared against ffprobe's profile string - see the video.profile catalogue limitations."
    severity: warning
    blocking: false

  - rule_id: video-level
    parameter_id: video.level
    operator: equals
    expected:
      value: "4"
    applies_to:
      stream_type: video
      quantifier: all
    display_name: "Video Level (Mpeg2LevelHigh)"
    description: "ffprobe reports numeric level codes - see the video.level catalogue limitations."
    severity: warning
    blocking: false

  - rule_id: video-width
    parameter_id: video.width
    operator: equals
    expected:
      value: 1920
      unit: px
    applies_to:
      stream_type: video
      quantifier: all
    display_name: "Frame Width"
    severity: warning
    blocking: false

  - rule_id: video-height
    parameter_id: video.height
    operator: equals
    expected:
