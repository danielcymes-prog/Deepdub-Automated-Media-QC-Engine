schema_version: 1.0.0

preset:
  id: vc037_prores_hq_hd
  version: 1.0.0
  client: vidchecker-library
  content_type: av_delivery
  title: "ProRes HQ HD"
  description: "Imported from the Vidchecker template '- ProRes HQ HD'. 2 Vidchecker check(s) are not yet covered; see the preset file header."
  owner: media-operations
  status: draft
  effective_date: 2026-07-27

defaults:
  blocking: true
  severity: error

rules:
  - rule_id: container-format
    parameter_id: container.format
    operator: equals
    expected:
      value: mov
    display_name: "Container Format"
    severity: warning
    blocking: false

  - rule_id: video-codec
    parameter_id: video.codec
    operator: equals
    expected:
      value: prores
    applies_to:
      stream_type: video
      quantifier: all
    display_name: "Video Codec (ProRes)"
    severity: warning
    blocking: false

  - rule_id: video-profile
    parameter_id: video.profile
    operator: equals
    expected:
      value: HQ
    applies_to:
      stream_type: video
      quantifier: all
    display_name: "Video Profile (ProResHq)"
    description: "Compared against ffprobe's profile string - see the video.profile catalogue limitations."
    severity: warning
    blocking: false

  - rule_id: video-width
    parameter_id: video.width
    operator: equals
    expected:
      value: 1920
      unit: px
    applies_to:
      stream_type: video
      quantifier: all
    display_name: "Frame Width"
    severity: warning
    blocking: false

  - rule_id: video-height
    parameter_id: video.height
    operator: equals
    expected:
      value: 1080
      unit: px
    applies_to:
      stream_type: video
      quantifier: all
    display_name: "Frame Height"
    severity: warning
    blocking: false

  - rule_id: chroma-subsampling
    parameter_id: video.pixel_format
    operator: contains
    expected:
      value: "422"
    applies_to:
      stream_type: video
      quantifier: all
    display_name: "Chroma Subsampling (422)"
    description: "Checked via the pixel-format token (e.g. yuv422p10le)."
    severity: warning
    blocking: false

  - rule_id: sample-aspect-ratio
    parameter_id: video.sample_aspect_ratio
    operator: equals
    expected:
      value: "1:1"
    applies_to:
      stream_type: video
      quantifier: all
    display_name: "Pixel Aspect Ratio (1:1)"
    severity: warning
    blocking: false

  - rule_id: display-aspect-ratio
    parameter_id: video.display_aspect_ratio
    operator: equals
    expected:
      value: "16:9"
    applies_to:
      stream_type: video
      quantifier: all
    display_name: "Display Aspect Ratio (16:9)"
    severity: warning
    blocking: false

  - rule_id: video-bitrate
    parameter_id: video.bitrate
    operator: between
    expected:
      min: 2e+08
      max: 2.4e+08
      unit: bit/s
    applies_to:
      stream_type: video
      quantifier: all
    display_name: "Video Bitrate (200-240 Mbit/s)"
    description: "Declared stream bitrate; streams without a declared bit rate skip this rule - see the video.bitrate catalogue limitations."
    severity: warning
    blocking: false

  - rule_id: overall-bitrate
    parameter_id: container.overall_bitrate
    operator: between
    expected:
      min: 1.95e+08
      max: 2.45e+08
      unit: bit/s
    display_name: "Overall Bitrate (195-245 Mbit/s)"
    severity: warning
    blocking: false
