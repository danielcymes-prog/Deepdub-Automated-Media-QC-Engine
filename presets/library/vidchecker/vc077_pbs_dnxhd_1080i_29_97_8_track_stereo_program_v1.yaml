schema_version: 1.0.0

preset:
  id: vc077_pbs_dnxhd_1080i_29_97_8_track_stereo_program
  version: 1.0.0
  client: vidchecker-library
  content_type: av_delivery
  title: "PBS - DNxHD 1080i 29.97 - 8 Track Stereo Program"
  description: "Imported from the Vidchecker template '- PBS - DNxHD 1080i 29.97 - 8 Track Stereo Program'. Vidchecker note: This template covers the general requirements for file based HD content to the PBS Technical Operating Specification 2016 Edition. 16 Vidchecker check(s) are not yet covered; see the preset file header."
  owner: media-operations
  status: draft
  effective_date: 2026-07-27

defaults:
  blocking: true
  severity: error

rules:
  - rule_id: container-format
    parameter_id: container.format
    operator: equals
    expected:
      value: mxf
    display_name: "Container Format"
    severity: warning
    blocking: false

  - rule_id: video-codec
    parameter_id: video.codec
    operator: equals
    expected:
      value: dnxhd
    applies_to:
      stream_type: video
      quantifier: all
    display_name: "Video Codec (Dnxhd)"
    severity: warning
    blocking: false

  - rule_id: video-width
    parameter_id: video.width
    operator: equals
    expected:
      value: 1920
      unit: px
    applies_to:
      stream_type: video
      quantifier: all
    display_name: "Frame Width"
    severity: warning
    blocking: false

  - rule_id: video-height
    parameter_id: video.height
    operator: equals
    expected:
      value: 1080
      unit: px
    applies_to:
      stream_type: video
      quantifier: all
    display_name: "Frame Height"
    severity: warning
    blocking: false

  - rule_id: chroma-subsampling
    parameter_id: video.pixel_format
    operator: contains
    expected:
      value: "422"
    applies_to:
      stream_type: video
      quantifier: all
    display_name: "Chroma Subsampling (422)"
    description: "Checked via the pixel-format token (e.g. yuv422p10le)."
    severity: warning
    blocking: false

  - rule_id: sample-aspect-ratio
    parameter_id: video.sample_aspect_ratio
    operator: equals
    expected:
      value: "1:1"
    applies_to:
      stream_type: video
      quantifier: all
    display_name: "Pixel Aspect Ratio (1:1)"
    severity: warning
    blocking: false

  - rule_id: display-aspect-ratio
    parameter_id: video.display_aspect_ratio
    operator: equals
    expected:
      value: "16:9"
    applies_to:
      stream_type: video
      quantifier: all
    display_name: "Display Aspect Ratio (16:9)"
    severity: warning
    blocking: false

  - rule_id: frame-rate
    parameter_id: video.frame_rate
    operator: approximately_equals
    expected:
      value: 29.97
      tolerance: 0.01
      unit: fps
    applies_to:
      stream_type: video
      quantifier: all
    display_name: "Frame Rate (29.97 fps)"
    severity: warning
    blocking: false

  - rule_id: video-bitrate
    parameter_id: video.bitrate
    operator: between
    expected:
      min: 1.3e+08
      max: 2.4e+08
      unit: bit/s
    applies_to:
      stream_type: video
      quantifier: all
    display_name: "Video Bitrate (130-240 Mbit/s)"
    description: "Declared stream bitrate; streams without a declared bit rate skip this rule - see the video.bitrate catalogue limitations."
    severity: warning
    blocking: false

  - rule_id: audio-track-count
    parameter_id: audio.stream_count
    operator: equals
    expected:
      value: 8
    display_name: "Audio Track Count"
    severity: warning
    blocking: false

  - rule_id: start-timecode
    parameter_id: container.timecode_start
    operator: equals
    expected:
      value: "00:59:45:00"
    display_name: "Start Timecode (00:59:45:00)"
    description: "Drop-frame material reports its timecode with a ';' separator; adjust the expected value for drop-frame deliverables."
    severity: warning
    blocking: false

  - rule_id: field-order
    parameter_id: video.field_order
    operator: equals
    expected:
      value: tff
    applies_to:
      stream_type: video
      quantifier: all
