# Generated from the Vidchecker 8.2.2 template '- AS-11 UK DPP V4.3 SD IMX Single Part' (template id 14) by scripts/import_vidchecker_templates.py.
# Source export: presets/_sources/vidchecker/ (captured 2026-07-27).
#
# ALL THRESHOLDS ARE PLACEHOLDERS PENDING HUMAN APPROVAL (handoff section 30).
#
# Vidchecker checks NOT covered by this preset (no implemented
# parameter yet - see docs/vidchecker-import.md):
#   - MXF structural checks (1 sub-tests): MXF structural checks are not implemented
#   - MxfOp: MXF operational pattern is not inspected
#   - EnhancedSyntax: codec bitstream syntax is not inspected
#   - Black Frame (required black segments): positional requirements are not expressible; only
#   - maximum-duration caps are
#   - Letterboxing: video.letterbox_detected is planned, no detector yet
#   - ChromaLevel: legal-level analysis (video.signal_range_event) is planned
#   - RgbGamut: legal-level analysis (video.signal_range_event) is planned
#   - ColourBars: colour-bars detection is not implemented
#   - SingleColor: single-colour frame detection is not implemented
#   - DigitalDropout: digital dropout detection is not implemented
#   - Flash: PSE/flashing analysis is not implemented
#   - AudioPhase: audio.phase_correlation is planned, no detector yet
#   - AudioPhase: audio.phase_correlation is planned, no detector yet
#
# NOTE: Vidchecker configures multiple audio check groups on the same track; they are flattened
# NOTE: conjunctively here and need review before approval.
schema_version: 1.0.0

preset:
  id: vc014_as_11_uk_dpp_v4_3_sd_imx_single_part
  version: 1.0.0
  client: vidchecker-library
  content_type: av_delivery
  title: "AS-11 UK DPP V4.3 SD IMX Single Part"
  description: "Imported from the Vidchecker template '- AS-11 UK DPP V4.3 SD IMX Single Part'. Vidchecker note: This template covers the general requirements for file based SD content to the AS-11 UK DPP Technical Standards V4.3.  Please see the Digital Production Partnership website for specific versions for UK broadcasters. Note that the audio checks need to be configured for the broadcasters required stereo and surround sound audio tracks and channel layout. 13 Vidchecker check(s) are not yet covered; see the preset file header."
  owner: media-operations
  status: draft
  effective_date: 2026-07-27

defaults:
  blocking: true
  severity: error

rules:
  - rule_id: container-format
    parameter_id: container.format
    operator: equals
    expected:
      value: mxf
    display_name: "Container Format"

  - rule_id: video-codec
    parameter_id: video.codec
    operator: equals
    expected:
      value: mpeg2video
    applies_to:
      stream_type: video
      quantifier: all
    display_name: "Video Codec (Mpeg2)"

  - rule_id: video-profile
    parameter_id: video.profile
    operator: equals
    expected:
      value: "4:2:2"
    applies_to:
      stream_type: video
      quantifier: all
    display_name: "Video Profile (Mpeg2422)"
    description: "Compared against ffprobe's profile string - see the video.profile catalogue limitations."

  - rule_id: video-level
    parameter_id: video.level
    operator: equals
    expected:
      value: "8"
    applies_to:
      stream_type: video
      quantifier: all
    display_name: "Video Level (Mpeg2LevelMain)"
    description: "ffprobe reports numeric level codes - see the video.level catalogue limitations."

  - rule_id: chroma-subsampling
    parameter_id: video.pixel_format
    operator: contains
    expected:
      value: "422"
    applies_to:
      stream_type: video
      quantifier: all
    display_name: "Chroma Subsampling (422)"
    description: "Checked via the pixel-format token (e.g. yuv422p10le)."

  - rule_id: display-aspect-ratio
    parameter_id: video.display_aspect_ratio
    operator: equals
    expected:
      value: "16:9"
    applies_to:
      stream_type: video
      quantifier: all
    display_name: "Display Aspect Ratio (16:9)"

  - rule_id: frame-rate
    parameter_id: video.frame_rate
    operator: approximately_equals
    expected:
      value: 25
      tolerance: 0.01
      unit: fps
    applies_to:
      stream_type: video
      quantifier: all
    display_name: "Frame Rate (25 fps)"

  - rule_id: video-bit-depth
    parameter_id: video.bit_depth
    operator: equals
    expected:
      value: 8
      unit: bit
    applies_to:
      stream_type: video
      quantifier: all
    display_name: "Video Bit Depth (8-bit)"

  - rule_id: video-bitrate
    parameter_id: video.bitrate
    operator: between
    expected:
      min: 4.9e+07
      max: 5.1e+07
      unit: bit/s
    applies_to:
      stream_type: video
      quantifier: all
    display_name: "Video Bitrate (49-51 Mbit/s)"
    description: "Declared stream bitrate; streams without a declared bit rate skip this rule - see the video.bitrate catalogue limitations."

  - rule_id: audio-track-count
    parameter_id: audio.stream_count
    operator: equals
    expected:
      value: 1
    display_name: "Audio Track Count"

  - rule_id: freeze-frames
    parameter_id: video.freeze_frame_event
    operator: less_than_or_equal
    expected:
      value: 5
      unit: s
    applies_to:
      stream_type: video
      quantifier: all
    display_name: "Freeze Frame Spans"
    description: "Legitimate static content (title cards, slates) registers as frozen - see the parameter caveat."
    severity: warning
    blocking: false

  - rule_id: field-order
    parameter_id: video.field_order
    operator: equals
    expected:
      value: tff
    applies_to:
      stream_type: video
      quantifier: all
    display_name: "Field Order (tff)"
    description: "Checks the declared stream flags; baseband field-dominance analysis is not implemented."
    severity: warning
    blocking: false

  - rule_id: audio-codec-t1
    parameter_id: audio.codec
    operator: in
    expected:
      values: [pcm_s24le, pcm_s24be]
    applies_to:
      stream_type: audio
      selector:
        index: 0
    display_name: "Audio Codec (PCM 24-bit)"

  - rule_id: audio-sample-rate-t1
    parameter_id: audio.sample_rate
    operator: equals
    expected:
      value: 48000
      unit: Hz
    applies_to:
      stream_type: audio
      selector:
        index: 0
    display_name: "Sample Rate"

  - rule_id: audio-channel-count-t1
    parameter_id: audio.channel_count
    operator: equals
    expected:
      value: 4
    applies_to:
      stream_type: audio
      selector:
        index: 0
    display_name: "Channel Count"

  - rule_id: integrated-loudness-t1
    parameter_id: audio.integrated_loudness
    operator: between
    expected:
      min: -24
      max: -22
      unit: LUFS
    applies_to:
      stream_type: audio
      selector:
        index: 0
    display_name: "Integrated Loudness (-23 \u00b11 LUFS)"
    description: "Vidchecker mode: EBU R128. Measured per stream; multi-mono channel groups need audio.group_integrated_loudness (planned, backlog #35)."

  - rule_id: max-peak-level-t1
    parameter_id: audio.true_peak
    operator: less_than_or_equal
    expected:
      value: -1
      unit: dBTP
    applies_to:
      stream_type: audio
      selector:
        index: 0
    display_name: "Peak Level (True Peak)"

  - rule_id: clipping-flat-factor-t1
    parameter_id: audio.flat_factor
    operator: less_than_or_equal
    expected:
      value: 0.01
    applies_to:
      stream_type: audio
      selector:
        index: 0
    display_name: "Clipping (Flat Factor)"
    description: "Vidchecker clipping sensitivity: Low. Whole-stream indicator, not per-event (audio.clipping_event is planned)."
    severity: warning
    blocking: false

  - rule_id: clipping-peak-level-t1
    parameter_id: audio.peak_level
    operator: less_than_or_equal
    expected:
      value: -0.1
      unit: dBFS
    applies_to:
      stream_type: audio
      selector:
        index: 0
    display_name: "Clipping (Sample Peak)"
    severity: warning
    blocking: false

  - rule_id: audio-codec-t1-g2
    parameter_id: audio.codec
    operator: in
    expected:
      values: [pcm_s24le, pcm_s24be]
    applies_to:
      stream_type: audio
      selector:
        index: 0
    display_name: "Audio Codec (PCM 24-bit)"

  - rule_id: audio-sample-rate-t1-g2
    parameter_id: audio.sample_rate
    operator: equals
    expected:
      value: 48000
      unit: Hz
    applies_to:
      stream_type: audio
      selector:
        index: 0
    display_name: "Sample Rate"

  - rule_id: max-peak-level-t1-g2
    parameter_id: audio.true_peak
    operator: less_than_or_equal
    expected:
      value: -1
      unit: dBTP
    applies_to:
      stream_type: audio
      selector:
        index: 0
    display_name: "Peak Level (True Peak)"

  - rule_id: clipping-flat-factor-t1-g2
    parameter_id: audio.flat_factor
    operator: less_than_or_equal
