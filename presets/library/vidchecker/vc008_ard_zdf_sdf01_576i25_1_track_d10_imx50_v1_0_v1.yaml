schema_version: 1.0.0

preset:
  id: vc008_ard_zdf_sdf01_576i25_1_track_d10_imx50_v1_0
  version: 1.0.0
  client: vidchecker-library
  content_type: av_delivery
  title: "ARD_ZDF_SDF01 576i25 1 Track D10 IMX50 V1.0"
  description: "Imported from the Vidchecker template '- ARD_ZDF_SDF01 576i25 1 Track D10 IMX50 V1.0'. Vidchecker note: This template covers the general requirements for file based HD content to the ARD_ZDF_SDF01 Technical Guidelines v1.0.  Please see the IRT website for further details: https://www.irt.de/en/publications/technical-guidelines.html 8 Vidchecker check(s) are not yet covered; see the preset file header."
  owner: media-operations
  status: draft
  effective_date: 2026-07-27

defaults:
  blocking: true
  severity: error

rules:
  - rule_id: container-format
    parameter_id: container.format
    operator: equals
    expected:
      value: mxf
    display_name: "Container Format"
    severity: warning
    blocking: false

  - rule_id: video-codec
    parameter_id: video.codec
    operator: equals
    expected:
      value: mpeg2video
    applies_to:
      stream_type: video
      quantifier: all
    display_name: "Video Codec (Mpeg2)"
    severity: warning
    blocking: false

  - rule_id: chroma-subsampling
    parameter_id: video.pixel_format
    operator: contains
    expected:
      value: "422"
    applies_to:
      stream_type: video
      quantifier: all
    display_name: "Chroma Subsampling (422)"
    description: "Checked via the pixel-format token (e.g. yuv422p10le)."
    severity: warning
    blocking: false

  - rule_id: frame-rate
    parameter_id: video.frame_rate
    operator: approximately_equals
    expected:
      value: 25
      tolerance: 0.01
      unit: fps
    applies_to:
      stream_type: video
      quantifier: all
    display_name: "Frame Rate (25 fps)"
    severity: warning
    blocking: false

  - rule_id: video-bit-depth
    parameter_id: video.pixel_format
    operator: regex
    expected:
      pattern: "p$"
    applies_to:
      stream_type: video
      quantifier: all
    display_name: "Video Bit Depth (8-bit, via pixel format)"
    description: "video.bit_depth is planned; the pixel-format token encodes component depth in the meantime."
    severity: warning
    blocking: false

  - rule_id: audio-track-count
    parameter_id: audio.stream_count
    operator: equals
    expected:
      value: 1
    display_name: "Audio Track Count"
    severity: warning
    blocking: false

  - rule_id: audio-codec-t1
    parameter_id: audio.codec
    operator: in
    expected:
      values: [pcm_s16le, pcm_s16be]
    applies_to:
      stream_type: audio
      selector:
        index: 0
    display_name: "Audio Codec (PCM 16-bit)"
    severity: warning
    blocking: false

  - rule_id: audio-sample-rate-t1
    parameter_id: audio.sample_rate
    operator: equals
    expected:
      value: 48000
      unit: Hz
    applies_to:
      stream_type: audio
      selector:
        index: 0
    display_name: "Sample Rate"
    severity: warning
    blocking: false

  - rule_id: integrated-loudness-t1
    parameter_id: audio.integrated_loudness
    operator: between
    expected:
      min: -24
      max: -22
      unit: LUFS
    applies_to:
      stream_type: audio
      selector:
        index: 0
    display_name: "Integrated Loudness (-23 \u00b11 LUFS)"
    description: "Vidchecker mode: EBU R128. Measured per stream; multi-mono channel groups need audio.group_integrated_loudness (planned, backlog #35)."
    severity: warning
    blocking: false

  - rule_id: max-peak-level-t1
    parameter_id: audio.true_peak
    operator: less_than_or_equal
    expected:
      value: -1
      unit: dBTP
    applies_to:
      stream_type: audio
      selector:
        index: 0
    display_name: "Peak Level (True Peak)"
    severity: warning
    blocking: false

  - rule_id: audio-video-length-t1
    parameter_id: audio.video_duration_delta
    operator: approximately_equals
    expected:
      value: 0
      tolerance: 0.5
      unit: s
    applies_to:
      stream_type: audio
      selector:
        index: 0
    display_name: "Audio/Video Duration Match"
    description: "Tolerance 0.5 s is a placeholder; Vidchecker's template carries no explicit tolerance."
    severity: warning
    blocking: false

  - rule_id: integrated-loudness-t1-g2
    parameter_id: audio.integrated_loudness
    operator: between
    expected:
      min: -24
      max: -22
      unit: LUFS
    applies_to:
      stream_type: audio
      selector:
        index: 0
    display_name: "Integrated Loudness (-23 \u00b11 LUFS)"
    description: "Vidchecker mode: EBU R128. Measured per stream; multi-mono channel groups need audio.group_integrated_loudness (planned, backlog #35)."
    severity: warning
    blocking: false

  - rule_id: max-peak-level-t1-g2
    parameter_id: audio.true_peak
    operator: less_than_or_equal
    expected:
      value: -3
      unit: dBTP
    applies_to:
      stream_type: audio
      selector:
        index: 0
    display_name: "Peak Level (True Peak)"
    severity: warning
    blocking: false
