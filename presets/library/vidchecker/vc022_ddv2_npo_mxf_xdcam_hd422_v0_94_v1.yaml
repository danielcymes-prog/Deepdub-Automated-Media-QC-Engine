    operator: equals
    expected:
      value: mpeg2video
    applies_to:
      stream_type: video
      quantifier: all
    display_name: "Video Codec (Mpeg2)"
    severity: warning
    blocking: false

  - rule_id: video-profile
    parameter_id: video.profile
    operator: equals
    expected:
      value: "4:2:2"
