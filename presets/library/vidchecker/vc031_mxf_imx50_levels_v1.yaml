schema_version: 1.0.0

preset:
  id: vc031_mxf_imx50_levels
  version: 1.0.0
  client: vidchecker-library
  content_type: av_delivery
  title: "MXF IMX50 Levels"
  description: "Imported from the Vidchecker template '- MXF IMX50 Levels'. 6 Vidchecker check(s) are not yet covered; see the preset file header."
  owner: media-operations
  status: draft
  effective_date: 2026-07-27

defaults:
  blocking: true
  severity: error

rules:
  - rule_id: container-format
    parameter_id: container.format
    operator: equals
    expected:
      value: mxf
    display_name: "Container Format"
    severity: warning
    blocking: false

  - rule_id: video-codec
    parameter_id: video.codec
    operator: equals
    expected:
      value: mpeg2video
    applies_to:
      stream_type: video
      quantifier: all
    display_name: "Video Codec (Mpeg2)"
    severity: warning
    blocking: false

  - rule_id: integrated-loudness
    parameter_id: audio.integrated_loudness
    operator: between
    expected:
      min: -26
      max: -22
      unit: LUFS
    applies_to:
      stream_type: audio
      quantifier: all
    display_name: "Integrated Loudness (-24 \u00b12 LUFS)"
    description: "Vidchecker mode: EBU R128. Measured per stream; multi-mono channel groups need audio.group_integrated_loudness (planned, backlog #35)."
    severity: warning
    blocking: false

  - rule_id: max-peak-level
    parameter_id: audio.true_peak
    operator: less_than_or_equal
    expected:
      value: -2
      unit: dBTP
    applies_to:
      stream_type: audio
      quantifier: all
    display_name: "Peak Level (True Peak)"
    severity: warning
    blocking: false
