        index: 0
    display_name: "Peak Level (True Peak)"
    severity: warning
    blocking: false

  - rule_id: clipping-flat-factor-t1-g2
    parameter_id: audio.flat_factor
    operator: less_than_or_equal
    expected:
      value: 0.01
    applies_to:
      stream_type: audio
      selector:
        index: 0
    display_name: "Clipping (Flat Factor)"
    description: "Vidchecker clipping sensitivity: Medium. Whole-stream indicator, not per-event (audio.clipping_event is planned)."
    severity: warning
    blocking: false

  - rule_id: clipping-peak-level-t1-g2
    parameter_id: audio.peak_level
