schema_version: 1.0.0

preset:
  id: vc040_xdcam_hd
  version: 1.0.0
  client: vidchecker-library
  content_type: av_delivery
  title: "XDCAM HD"
  description: "Imported from the Vidchecker template '- XDCAM HD'. 1 Vidchecker check(s) are not yet covered; see the preset file header."
  owner: media-operations
  status: draft
  effective_date: 2026-07-27

defaults:
  blocking: true
  severity: error

rules:
  - rule_id: container-format
    parameter_id: container.format
    operator: equals
    expected:
      value: mxf
    display_name: "Container Format"
    severity: warning
    blocking: false

  - rule_id: video-codec
    parameter_id: video.codec
    operator: equals
    expected:
      value: mpeg2video
    applies_to:
      stream_type: video
      quantifier: all
    display_name: "Video Codec (Mpeg2)"
    severity: warning
    blocking: false

  - rule_id: video-profile
    parameter_id: video.profile
    operator: equals
    expected:
      value: Main
    applies_to:
      stream_type: video
      quantifier: all
    display_name: "Video Profile (Mpeg2Main)"
    description: "Compared against ffprobe's profile string - see the video.profile catalogue limitations."
    severity: warning
    blocking: false

  - rule_id: chroma-subsampling
    parameter_id: video.pixel_format
    operator: contains
    expected:
      value: "420"
    applies_to:
      stream_type: video
      quantifier: all
    display_name: "Chroma Subsampling (420)"
    description: "Checked via the pixel-format token (e.g. yuv422p10le)."
    severity: warning
    blocking: false

  - rule_id: display-aspect-ratio
    parameter_id: video.display_aspect_ratio
    operator: equals
    expected:
      value: "16:9"
    applies_to:
      stream_type: video
      quantifier: all
    display_name: "Display Aspect Ratio (16:9)"
    severity: warning
    blocking: false

  - rule_id: video-bitrate
    parameter_id: video.bitrate
    operator: between
    expected:
      min: 1.5e+07
      max: 3.9e+07
      unit: bit/s
    applies_to:
      stream_type: video
      quantifier: all
    display_name: "Video Bitrate (15-39 Mbit/s)"
    description: "Declared stream bitrate; streams without a declared bit rate skip this rule - see the video.bitrate catalogue limitations."
    severity: warning
    blocking: false

  - rule_id: overall-bitrate
    parameter_id: container.overall_bitrate
    operator: between
    expected:
      min: 1.4e+07
      max: 4e+07
      unit: bit/s
    display_name: "Overall Bitrate (14-40 Mbit/s)"
    severity: warning
    blocking: false
