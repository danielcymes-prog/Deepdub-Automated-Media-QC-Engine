schema_version: 1.0.0

preset:
  id: vc010_as_10_50mbps_1080i50_high_hd_2014
  version: 1.0.0
  client: vidchecker-library
  content_type: av_delivery
  title: "AS-10 50Mbps 1080i50 HIGH_HD_2014"
  description: "Imported from the Vidchecker template '- AS-10 50Mbps 1080i50 HIGH_HD_2014'. 10 Vidchecker check(s) are not yet covered; see the preset file header."
  owner: media-operations
  status: draft
  effective_date: 2026-07-27

defaults:
  blocking: true
  severity: error

rules:
  - rule_id: container-format
    parameter_id: container.format
    operator: equals
    expected:
      value: mxf
    display_name: "Container Format"
    severity: warning
    blocking: false

  - rule_id: video-codec
    parameter_id: video.codec
    operator: equals
    expected:
      value: mpeg2video
    applies_to:
      stream_type: video
      quantifier: all
    display_name: "Video Codec (Mpeg2)"
    severity: warning
    blocking: false

  - rule_id: video-width
    parameter_id: video.width
    operator: equals
    expected:
      value: 1920
      unit: px
    applies_to:
      stream_type: video
      quantifier: all
    display_name: "Frame Width"
    severity: warning
    blocking: false

  - rule_id: video-height
    parameter_id: video.height
    operator: equals
    expected:
      value: 1080
      unit: px
    applies_to:
      stream_type: video
      quantifier: all
    display_name: "Frame Height"
    severity: warning
    blocking: false

  - rule_id: chroma-subsampling
    parameter_id: video.pixel_format
    operator: contains
    expected:
      value: "422"
    applies_to:
      stream_type: video
      quantifier: all
    display_name: "Chroma Subsampling (422)"
    description: "Checked via the pixel-format token (e.g. yuv422p10le)."
    severity: warning
    blocking: false

  - rule_id: frame-rate
    parameter_id: video.frame_rate
    operator: approximately_equals
    expected:
      value: 25
      tolerance: 0.01
      unit: fps
    applies_to:
      stream_type: video
      quantifier: all
    display_name: "Frame Rate (25 fps)"
    severity: warning
    blocking: false

  - rule_id: video-bit-depth
    parameter_id: video.pixel_format
    operator: regex
    expected:
      pattern: "p$"
    applies_to:
      stream_type: video
      quantifier: all
    display_name: "Video Bit Depth (8-bit, via pixel format)"
    description: "video.bit_depth is planned; the pixel-format token encodes component depth in the meantime."
    severity: warning
    blocking: false
