schema_version: 1.0.0

preset:
  id: topic_delivery
  version: 1.0.0
  client: topic
  content_type: av_delivery
  title: TOPIC-Delivery
  description: "Imported from the Vidchecker template 'TOPIC-Delivery'. 3 Vidchecker check(s) are not yet covered; see the preset file header."
  owner: media-operations
  status: draft
  effective_date: 2026-07-27

defaults:
  blocking: true
  severity: error

rules:
  - rule_id: container-format
    parameter_id: container.format
    operator: equals
    expected:
      value: mov
    display_name: "Container Format"
    severity: warning
    blocking: false

  - rule_id: video-codec
    parameter_id: video.codec
    operator: equals
    expected:
      value: prores
    applies_to:
      stream_type: video
      quantifier: all
    display_name: "Video Codec (ProRes)"
    severity: warning
    blocking: false

  - rule_id: video-width
    parameter_id: video.width
    operator: equals
    expected:
      value: 1920
      unit: px
    applies_to:
      stream_type: video
      quantifier: all
    display_name: "Frame Width"
    severity: warning
    blocking: false

  - rule_id: video-height
    parameter_id: video.height
    operator: equals
    expected:
      value: 1080
      unit: px
    applies_to:
      stream_type: video
      quantifier: all
    display_name: "Frame Height"
    severity: warning
    blocking: false

  - rule_id: audio-codec
    parameter_id: audio.codec
    operator: in
    expected:
      values: [pcm_s24le, pcm_s24be]
    applies_to:
      stream_type: audio
      quantifier: all
    display_name: "Audio Codec (PCM 24-bit)"
    severity: warning
    blocking: false

  - rule_id: audio-sample-rate
    parameter_id: audio.sample_rate
    operator: equals
    expected:
      value: 48000
      unit: Hz
    applies_to:
      stream_type: audio
      quantifier: all
    display_name: "Sample Rate"
    severity: warning
    blocking: false

  - rule_id: audio-channel-layout
    parameter_id: audio.channel_layout
    operator: in
    expected:
      values: [stereo]
    applies_to:
      stream_type: audio
      quantifier: all
    display_name: "Channel Layout (stereo)"
    severity: warning
    blocking: false

  - rule_id: integrated-loudness
    parameter_id: audio.integrated_loudness
    operator: between
    expected:
      min: -26
      max: -22
      unit: LUFS
    applies_to:
      stream_type: audio
      quantifier: all
    display_name: "Integrated Loudness (-24 \u00b12 LUFS)"
    description: "Vidchecker mode: EBU R128. Measured per stream; multi-mono channel groups need audio.group_integrated_loudness (planned, backlog #35)."
    severity: warning
    blocking: false

  - rule_id: clipping-flat-factor
    parameter_id: audio.flat_factor
    operator: less_than_or_equal
    expected:
      value: 0.01
    applies_to:
      stream_type: audio
      quantifier: all
    display_name: "Clipping (Flat Factor)"
    description: "Vidchecker clipping sensitivity: Medium. Whole-stream indicator, not per-event (audio.clipping_event is planned)."
    severity: warning
    blocking: false

  - rule_id: clipping-peak-level
    parameter_id: audio.peak_level
    operator: less_than_or_equal
    expected:
      value: -0.1
      unit: dBFS
    applies_to:
      stream_type: audio
      quantifier: all
    display_name: "Clipping (Sample Peak)"
    severity: warning
    blocking: false

  - rule_id: min-level
    parameter_id: audio.low_rms_event
    operator: less_than_or_equal
    expected:
      value: 10
      unit: s
    applies_to:
      stream_type: audio
      quantifier: all
    display_name: "Min Level (Windowed RMS)"
    severity: warning
    blocking: false
